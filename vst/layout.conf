# MPC DJ FX - native skin (HTML artwork). Pages: DJ / REPEAT / DELAY / VERB / FLANGE / SETUP.
# Built by the framework tooling (gen_vst + shadow_skin + html_art); render every page with
#   vst/preview.sh   -> docs/ui-preview/page_*.png
# Theme matches the sibling ports (charcoal + red). 2-state switches are enum_h and stay OFF the
# Q-Links (a 2-entry option list flips on any Q-Link event).
theme_bg=24252a
theme_panel=1b1c20
theme_line=3a3c42
theme_ink=f0f0ee
theme_ink_dim=9a9ca2
theme_ink_faint=5c5e64
theme_accent=c8102e
theme_accent_hi=e2344b
theme_knob_face=131417
theme_knob_ring=050607
theme_knob_dot=f2f2f0
theme_lcd=0c0d10
theme_seg_active=c8102e
theme_seg_inactive=1a1b1f
theme_seg_active_tx=f6f6f4
toggle_look=led
scale_names=1
label_scale=1.35

# ---------------------------------------------------------------- Page 1 - MACROS
[tab MACROS]
art file=bg_plain.png fit=cover
text cx=640 cy=196 label="MPC DJ FX" size=2.2 color=e2344b
knob cx=180  cy=330 r=46 label="LOW-EQ"  key=mac_lo
knob cx=480  cy=330 r=46 label="MID-EQ"  key=mac_mid
knob cx=780  cy=330 r=46 label="HI-EQ"   key=mac_hi
knob cx=1080 cy=330 r=46 label="LPF"     key=mac_lpf
knob cx=180  cy=560 r=46 label="GLITCH"  key=mac_glitch
knob cx=480  cy=560 r=46 label="VERB"    key=mac_verb
knob cx=780  cy=560 r=46 label="FADE"    key=mac_fade
knob cx=1080 cy=560 r=46 label="AUTO-FILL" key=mac_fill
qlinks "MACROS" = mac_lo,mac_mid,mac_hi,mac_lpf,mac_glitch,mac_verb,mac_fade,mac_fill

# ---------------------------------------------------------------- Page 1 - DJ
[tab DJ]
art file=bg.png fit=cover
text cx=640 cy=196 label="DJ" size=2.2 color=e2344b
meter cx=1048 cy=596 w=304 h=40 key=vu strip=art/vu_strip.png frames=24
knob cx=160  cy=300 r=46 label="FILTER" key=dj_filter
knob cx=400  cy=300 r=46 label="RESO"   key=dj_reso
knob cx=640  cy=300 r=46 label="LOW"    key=iso_lo
knob cx=880  cy=300 r=46 label="MID"    key=iso_mid
button cx=1120 cy=300 label="PANIC" key=panic
knob cx=160  cy=555 r=46 label="HI"     key=iso_hi
knob cx=400  cy=555 r=46 label="MIX"    key=mix
knob cx=640  cy=555 r=46 label="OUTPUT" key=output_gain
qlinks "DJ" = dj_filter,dj_reso,iso_lo,iso_mid,iso_hi,mix,output_gain

# ---------------------------------------------------------------- Page 2 - REPEAT
[tab REPEAT]
art file=bg_plain.png fit=cover
text cx=640 cy=196 label="BEAT REPEAT" size=2.2 color=e2344b
enum_h cx=640 cy=310 label="GRID" key=rep_mode sw=72 rows=2
knob cx=200 cy=520 r=46 label="GATE"    key=rep_gate
knob cx=440 cy=520 r=46 label="CHANCE"  key=rep_chance
knob cx=680 cy=520 r=46 label="REPEATS" key=rep_count
knob cx=920 cy=520 r=46 label="GLITCH"  key=rep_mix
qlinks "REPEAT" = rep_mode,rep_gate,rep_chance,rep_count,rep_mix

# ---------------------------------------------------------------- Page 3 - DELAY
[tab DELAY]
art file=bg_plain.png fit=cover
text cx=640 cy=196 label="DELAY" size=2.2 color=e2344b
knob   cx=180 cy=300 r=46 label="TIME" key=dly_time
enum_h cx=520 cy=300 label="SYNC" key=dly_sync sw=90
enum_h cx=880 cy=310 label="DIV" key=dly_div sw=72 rows=2
knob   cx=180 cy=520 r=46 label="FBK"  key=dly_fbk
knob   cx=480 cy=520 r=46 label="TONE" key=dly_tone
enum_h cx=820 cy=520 label="PONG" key=dly_pingpong sw=90
qlinks "DELAY" = dly_time,dly_fbk,dly_tone,dly_div

# ---------------------------------------------------------------- Page 4 - VERB
[tab VERB]
art file=bg_plain.png fit=cover
text cx=640 cy=196 label="REVERB" size=2.2 color=e2344b
enum_h cx=300 cy=300 label="MODE" key=verb_mode sw=90
knob cx=640 cy=300 r=46 label="VERB"  key=verb_amount
knob cx=920 cy=300 r=46 label="DECAY" key=verb_decay
knob cx=300 cy=520 r=46 label="DAMP"  key=verb_damp
knob cx=640 cy=520 r=46 label="PRE"   key=verb_predelay
qlinks "VERB" = verb_amount,verb_decay,verb_damp,verb_predelay

# ---------------------------------------------------------------- Page 5 - FLANGE
[tab FLANGE]
art file=bg_plain.png fit=cover
text cx=640 cy=196 label="FLANGER" size=2.2 color=e2344b
knob cx=200  cy=400 r=46 label="RATE"  key=fl_rate
knob cx=500  cy=400 r=46 label="DEPTH" key=fl_depth
knob cx=800  cy=400 r=46 label="FBK"   key=fl_fbk
knob cx=1100 cy=400 r=46 label="MIX"   key=fl_mix
qlinks "FLANGE" = fl_rate,fl_depth,fl_fbk,fl_mix

# ---------------------------------------------------------------- Page 6 - SETUP
[tab SETUP]
art file=bg_plain.png fit=cover
text cx=640 cy=196 label="SETUP" size=2.2 color=e2344b
knob   cx=320 cy=320 r=46 label="LO X"  key=iso_lo_x
knob   cx=640 cy=320 r=46 label="HI X"  key=iso_hi_x
enum_h cx=960 cy=320 label="LIMITER" key=limiter sw=90
text cx=640 cy=590 label="MPC DJ FX - MIT - sd88me/mpc-vst-plugins" size=1.1 color=5c5e64
qlinks "SETUP" = iso_lo_x,iso_hi_x
